name: CI/CD Pipeline
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-build-publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installation de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Installer les dépendances npm
      - name: Install dependencies
        run: npm install

      # 4️⃣ Exécuter les tests
      - name: Run tests
        run: npm test

      # 5️⃣ Connexion au GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6️⃣ Construire l'image Docker
      - name: Build Docker image
        run: docker build -t ghcr.io/soryking04/devops-ci-cd-pipeline/node-app:staging .

      # 7️⃣ Pousser l'image Docker
      - name: Push Docker image
        run: docker push ghcr.io/soryking04/devops-ci-cd-pipeline/node-app:staging